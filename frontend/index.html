<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Timetables, exams, room bookings and disruption repair for Chilika Institute of Technology" />
    <meta name="theme-color" content="#24292f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Velora</title>
    <script>
      // light by default; apply a saved dark choice before first paint, so it doesn't flash light
      try {
        if (localStorage.getItem("cit-theme") === "dark") document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
