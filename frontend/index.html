<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Timetables, exams, room bookings and disruption repair for Chilika Institute of Technology" />
    <meta name="theme-color" content="#24292f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CIT Campus Scheduler</title>
    <script>
      // apply the saved theme before first paint, so dark mode doesn't flash light
      try {
        var t = localStorage.getItem("cit-theme")
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
